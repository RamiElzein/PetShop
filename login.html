<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - PetShop</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">PetShop</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      <a href="about.html">About</a>
      <a href="login.html" id="auth-link">Log in</a>
    </nav>
  </header>
  <div id="message"></div>

  <main class="container narrow">
    <h1>Log in or create an account</h1>
    <form id="auth-form" class="form">
      <label>Email <input type="email" id="email" required></label>
      <label>Password <input type="password" id="password" minlength="6" required></label>
      <div class="actions">
        <button type="submit" class="btn" id="login-btn">Log in</button>
        <button type="button" class="btn grey" id="signup-btn">Sign up</button>
      </div>
      <p id="auth-msg"></p>
    </form>
  </main>

  <footer>&copy; 2026 PetShop. Pet supplies and enclosures for your home pets.</footer>
  <script src="js/app.js"></script>
  <script>
    const msg = document.getElementById("auth-msg");
    const email = () => document.getElementById("email").value.trim();
    const password = () => document.getElementById("password").value;

    document.getElementById("auth-form").onsubmit = async e => {
      e.preventDefault();
      const { error } = await supabaseClient.auth.signInWithPassword({ email: email(), password: password() });
      if (error) { msg.textContent = error.message; return; }
      window.location.href = getCart().length ? "checkout.html" : "products.html";
    };

    document.getElementById("signup-btn").onclick = async () => {
      if (!document.getElementById("auth-form").reportValidity()) return;
      const { data, error } = await supabaseClient.auth.signUp({ email: email(), password: password() });
      if (error) { msg.textContent = error.message; return; }
      if (data.session) window.location.href = getCart().length ? "checkout.html" : "products.html";
      else msg.textContent = "Account created. Check your email to confirm, then log in.";
    };
  </script>
</body>
</html>
