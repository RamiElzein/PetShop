<!DOCTYPE html>
<html lang="en">

  <title>Home - Tech Store</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase CDN SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
