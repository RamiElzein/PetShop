<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <section id="detail" style="padding: 20px;">
      <p>Loading product details...</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 ShopNow.</p>
  </footer>

  <script>
    const SUPABASE_URL = "https://pcwpnhluaqfgstkrmvie.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_6lx3SK9RSLTDfMfieaUUdA_vYF28OAp";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadProductDetail() {
      const params = new URLSearchParams(window.location.search);
      const productId = params.get("id");

      if (!productId) {
        document.getElementById("detail").innerHTML = "<p>No product specified.</p>";
        return;
      }

      const { data: product, error } = await supabase
        .from("product")
        .select("*, category(category_name)")
        .eq("product_id", productId)
        .single();

      const detailSection = document.getElementById("detail");

      if (error || !product) {
        detailSection.innerHTML = `<p>Could not load product details: ${error ? error.message : "Product not found"}</p>`;
        return;
      }

      const stockLabel = 
        product.stock === 0
          ? "Out of Stock"
          : product.stock <= 5
          ? "Low Stock"
          : "In Stock";

      detailSection.innerHTML = `
        <h2>${product.name}</h2>
        <p><strong>Category:</strong> ${product.category ? product.category.category_name : "N/A"}</p>
        <p><strong>Price:</strong> AED ${product.price.toLocaleString()}</p>
        <p><strong>Stock Status:</strong> <span class="stock">${stockLabel}</span> (${product.stock} available)</p>
        <p><strong>Description:</strong> ${product.description || "No description available."}</p>
        <p><a href="products.html">&larr; Back to Products</a></p>
      `;
    }

    loadProductDetail();
  </script>
</body>
</html>
