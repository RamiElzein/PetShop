<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - ShopNow</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main style="padding: 20px;">
    <h2>Our Products</h2>
    <p>Find the technology you need at honest prices.</p>
    
    <!-- Search and Filters -->
    <div style="margin-bottom: 20px;">
      <input type="text" id="search-bar" placeholder="Search products..." style="padding: 5px; width: 200px;">
      <div id="category-filters" style="display: inline-block; margin-left: 10px;"></div>
    </div>

    <!-- Product List Container -->
    <div id="product-list" style="display: flex; flex-wrap: wrap; gap: 20px;">
      <p>Loading products...</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 ShopNow.</p>
  </footer>

  <!-- App Script -->
  <script src="js/app.js"></script>
