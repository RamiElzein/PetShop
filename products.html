<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <section class="products-header">
      <h2>Our Products</h2>
      <p>Find the technology you need at honest prices.</p>
    </section>

    <section class="filters">
      <input type="text" id="search-box" placeholder="Search products...">
      <div class="category-buttons">
        <button class="category-btn" data-category="All">All</button>
        <button class="category-btn" data-category="Computers">Computers</button>
        <button class="category-btn" data-category="Phones">Phones</button>
        <button class="category-btn" data-category="Accessories">Accessories</button>
      </div>
      <select id="sort-select">
        <option value="default">Sort Products</option>
        <option value="low-high">Price: Low to High</option>
        <option value="high-low">Price: High to Low</option>
      </select>
    </section>

    <section class="product-grid" id="product-list"></section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 ShopNow.</p>
  </footer>

  <!-- Supabase CDN Script (Required for Lab 4) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
</body>
</html>
