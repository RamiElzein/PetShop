<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - PetShop</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">PetShop</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      <a href="about.html">About</a>
      <a href="login.html" id="auth-link">Log in</a>
    </nav>
  </header>
  <div id="message"></div>

  <main class="container narrow">
    <h1>Checkout</h1>
    <div id="summary"></div>
    <form id="checkout-form" class="form">
      <label>Full name <input type="text" id="name" maxlength="100" required></label>
      <label>Phone <input type="tel" id="phone" pattern="[0-9+ ]{7,15}" required></label>
      <label>Delivery address <textarea id="address" maxlength="300" required></textarea></label>
      <button type="submit" class="btn">Place order</button>
      <p id="checkout-msg"></p>
    </form>
  </main>

  <footer>&copy; 2026 PetShop. Pet supplies and enclosures for your home pets.</footer>
  <script src="js/app.js"></script>
  <script>
    (async () => {
      const { data } = await supabaseClient.auth.getSession();
      if (!data.session) { window.location.href = "login.html"; return; }
      const cart = getCart();
      if (cart.length === 0) { window.location.href = "cart.html"; return; }
      const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
      document.getElementById("summary").innerHTML =
        cart.map(i => `<p>${i.quantity} x ${escapeHtml(i.name)} - ${formatPrice(i.price * i.quantity)}</p>`).join("") +
        `<h2>Total: ${formatPrice(total)}</h2>`;

      document.getElementById("checkout-form").onsubmit = async e => {
        e.preventDefault();
        const msg = document.getElementById("checkout-msg");
        const name = document.getElementById("name").value.trim();
        const address = document.getElementById("address").value.trim();
        if (!name || !address) { msg.textContent = "Please fill in all fields."; return; }

        const { data: order, error } = await supabaseClient.from("orders").insert({
          user_id: data.session.user.id,
          customer_name: name,
          phone: document.getElementById("phone").value.trim(),
          address: address,
          total: total
        }).select().single();
        if (error) { msg.textContent = "Order failed: " + error.message; return; }

        const items = cart.map(i => ({ order_id: order.id, product_id: i.id, quantity: i.quantity, price: i.price }));
        const { error: itemsError } = await supabaseClient.from("order_items").insert(items);
        if (itemsError) { msg.textContent = "Order failed: " + itemsError.message; return; }

        saveCart([]);
        window.location.href = "confirmation.html?order=" + order.id;
      };
    })();
  </script>
</body>
</html>
